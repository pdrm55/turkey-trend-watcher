<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Özel Haber (Editorial) | TrendiaTR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-8">

    <div class="max-w-6xl mx-auto">
        <!-- Header -->
        <header class="flex justify-between items-center mb-10">
            <div class="flex items-center gap-4">
                <a href="/admin" class="text-slate-400 hover:text-white transition-colors flex items-center gap-2 font-semibold">
                    ⬅️ Back to Admin
                </a>
                <h1 class="text-3xl font-black tracking-tight text-white">TrendiaTR <span class="text-emerald-500">Editorial</span></h1>
            </div>
        </header>

        <!-- Main Workspace -->
        <section class="bg-slate-800 p-6 rounded-2xl border border-slate-700 mb-8 shadow-lg">
            <h2 class="text-xl font-bold mb-6 flex items-center gap-2">
                📝 Yapay Zeka ile Özel Haber Oluştur
            </h2>
            
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                <!-- Left Column: Raw Input -->
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs text-slate-400 uppercase tracking-wider mb-2">Haberin Ana Metni (Raw Text)</label>
                        <textarea id="edRawText" rows="18" class="w-full bg-slate-900 border border-slate-600 rounded-lg px-4 py-3 text-white focus:border-emerald-500 focus:outline-none placeholder-slate-600 whitespace-pre-wrap" placeholder="Haberin detaylarını buraya yapıştırın..."></textarea>
                    </div>
                    <button id="btnAiDraft" onclick="generateEditorialDraft()" class="w-full bg-purple-600 hover:bg-purple-500 text-white font-bold px-4 py-4 rounded-lg transition-colors flex justify-center items-center gap-2 shadow-lg text-lg">
                        ✨ Yapay Zeka ile Analiz Et
                    </button>
                </div>

                <!-- Right Column: Editable Output -->
                <div class="space-y-5 bg-slate-900/50 p-6 rounded-xl border border-slate-700">
                    <div>
                        <label class="block text-xs text-slate-400 uppercase tracking-wider mb-2">Başlık (Headline)</label>
                        <input type="text" id="edTitle" class="w-full bg-slate-900 border border-slate-600 rounded-lg px-4 py-3 text-white focus:border-blue-500 focus:outline-none font-bold text-lg">
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 uppercase tracking-wider mb-2">Kategori (Category)</label>
                        <select id="edCategory" class="w-full bg-slate-900 border border-slate-600 rounded-lg px-4 py-3 text-white focus:border-blue-500 focus:outline-none">
                            <option value="Gündem">Gündem</option>
                            <option value="Siyaset">Siyaset</option>
                            <option value="Ekonomi">Ekonomi</option>
                            <option value="Spor">Spor</option>
                            <option value="Teknoloji">Teknoloji</option>
                            <option value="Sanat">Sanat</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 uppercase tracking-wider mb-2">Özet (Summary)</label>
                        <textarea id="edSummary" rows="6" class="w-full bg-slate-900 border border-slate-600 rounded-lg px-4 py-3 text-white focus:border-blue-500 focus:outline-none whitespace-pre-wrap leading-relaxed"></textarea>
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 uppercase tracking-wider mb-2">Görsel URL (İsteğe Bağlı)</label>
                        <input type="text" id="edImageUrl" placeholder="https://..." class="w-full bg-slate-900 border border-slate-600 rounded-lg px-4 py-3 text-white focus:border-blue-500 focus:outline-none text-sm">
                    </div>
                    
                    <div class="pt-4 mt-2 border-t border-slate-700">
                        <button id="btnPublishEditorial" onclick="publishEditorialNews()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-8 py-4 rounded-lg transition-colors disabled:opacity-50 disabled:cursor-not-allowed shadow-lg text-lg flex justify-center items-center gap-2" disabled>
                            🚀 Trend Olarak Yayınla
                        </button>
                        <p class="text-xs text-slate-500 text-center mt-3">Yayınlandığı an sisteme yüksek TPS ile girer ve X-Worker tarafından otomatik işlenir.</p>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <script>
        async function generateEditorialDraft() {
            const rawText = document.getElementById('edRawText').value.trim();
            const btn = document.getElementById('btnAiDraft');
            
            if (rawText.length < 50) {
                alert("Lütfen en az 50 karakterlik bir haber metni girin.");
                return;
            }

            btn.innerHTML = "⏳ Analiz Ediliyor...";
            btn.disabled = true;

            try {
                const res = await fetch('/api/admin/news/draft', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ content: rawText })
                });
                
                const data = await res.json();
                
                if (data.status === 'success') {
                    document.getElementById('edTitle').value = data.title;
                    document.getElementById('edSummary').value = data.summary;
                    document.getElementById('edCategory').value = data.category;
                    
                    document.getElementById('btnPublishEditorial').disabled = false;
                } else {
                    alert("Hata: " + (data.error || "Bilinmeyen bir hata oluştu."));
                }
            } catch (e) {
                alert("Sunucuya bağlanılamadı.");
            } finally {
                btn.innerHTML = "✨ Yapay Zeka ile Analiz Et";
                btn.disabled = false;
            }
        }

        async function publishEditorialNews() {
            const rawText = document.getElementById('edRawText').value.trim();
            const title = document.getElementById('edTitle').value.trim();
            const summary = document.getElementById('edSummary').value.trim();
            const category = document.getElementById('edCategory').value;
            const imageUrl = document.getElementById('edImageUrl').value.trim();
            
            const btn = document.getElementById('btnPublishEditorial');

            if (!title || !summary) {
                alert("Lütfen başlık ve özet alanlarının dolu olduğundan emin olun.");
                return;
            }

            btn.innerHTML = "🚀 Yayınlanıyor...";
            btn.disabled = true;

            try {
                const res = await fetch('/api/admin/news/publish', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        content: rawText,
                        title: title,
                        summary: summary,
                        category: category,
                        image_url: imageUrl
                    })
                });
                
                const data = await res.json();
                
                if (data.status === 'success') {
                    alert(`✅ Haber başarıyla yayınlandı!\n\nSistem bu haberi doğrudan trendlere aldı (TPS: ${data.tps}).\nBirkaç saniye içinde X-Worker tarafından işlenecektir.`);
                    // Reset fields
                    document.getElementById('edRawText').value = '';
                    document.getElementById('edTitle').value = '';
                    document.getElementById('edSummary').value = '';
                    document.getElementById('edImageUrl').value = '';
                    btn.disabled = true;
                    btn.innerHTML = "🚀 Trend Olarak Yayınla";
                } else {
                    alert("Hata: " + (data.error || "Yayınlama başarısız."));
                    btn.disabled = false;
                    btn.innerHTML = "🚀 Trend Olarak Yayınla";
                }
            } catch (e) {
                alert("Sunucuya bağlanılamadı.");
                btn.disabled = false;
                btn.innerHTML = "🚀 Trend Olarak Yayınla";
            }
        }
    </script>
</body>
</html>
